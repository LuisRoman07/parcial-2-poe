<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas - MVC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="src/styles/styles.css?v=4">
</head>
<body>

    <div class="app-container">

        <header class="app-header text-center mb-5">
            <h1 class="display-5">Lista de Tareas</h1>
            <p class="text-muted">Organiza tus actividades diarias de forma rápida y sencilla</p>
        </header>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card p-4 sticky-form">
                    <h3 class="h5 mb-3">Añadir Nueva Tarea</h3>
                    <form id="form-tarea">
                        <div class="mb-3">
                            <label for="titulo" class="form-label">Título de la Tarea</label>
                            <input type="text" id="titulo" class="form-control" placeholder="Ej: Comprar víveres" required>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción Detallada</label>
                            <textarea id="descripcion" class="form-control" rows="3" placeholder="Ej: Leche, pan, huevos, café, etc." required></textarea>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label for="prioridad" class="form-label">Prioridad</label>
                                <select id="prioridad" class="form-select">
                                    <option value="alta">Alta</option>
                                    <option value="media" selected>Media</option>
                                    <option value="baja">Baja</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="fecha-limite" class="form-label">Fecha límite</label>
                                <input type="date" id="fecha-limite" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Guardar Tarea</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card p-3 mb-3">
                    <div class="row g-2 align-items-center">
                        <div class="col-12">
                            <input type="text" id="buscar" class="form-control" placeholder="Buscar por título...">
                        </div>
                        <div class="col-md-4">
                            <select id="filtro" class="form-select" aria-label="Filtrar por estado">
                                <option value="todas">Todos los estados</option>
                                <option value="pendientes">Pendientes</option>
                                <option value="completadas">Completadas</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <select id="filtro-prioridad" class="form-select" aria-label="Filtrar por prioridad">
                                <option value="todas">Todas las prioridades</option>
                                <option value="alta">Alta</option>
                                <option value="media">Media</option>
                                <option value="baja">Baja</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <select id="orden" class="form-select" aria-label="Ordenar">
                                <option value="ninguno">Sin ordenar</option>
                                <option value="fecha">Ordenar por fecha</option>
                                <option value="prioridad">Ordenar por prioridad</option>
                            </select>
                        </div>
                    </div>
                </div>

                <p id="contador" class="contador mb-3" aria-live="polite"></p>

                <div id="lista-tareas">

                </div>
            </div>
        </div>
    </div>

    <script type="module" src="dist/main.js"></script>
</body>
</html>
